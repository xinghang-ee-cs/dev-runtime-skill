name: Release Runtime Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills-manifest.json'
      - '.github/workflows/release-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-skills-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest
        run: python scripts/validate-skill-manifest.py
      - name: Test synchronization tool
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Resolve release tag
        id: release
        run: |
          version="$(python -c 'import json; print(json.load(open("skills-manifest.json", encoding="utf-8"))["release_version"])')"
          channel="$(python -c 'import json; print(json.load(open("skills-manifest.json", encoding="utf-8"))["repository"]["channel"])')"
          case "$channel" in
            stable) prerelease=false ;;
            prerelease) prerelease=true ;;
            *) echo "Unsupported release channel: $channel" >&2; exit 1 ;;
          esac
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - name: Create release tag when missing
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Runtime Skills ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease --latest=false
            else
              gh release edit "$TAG" --prerelease=false
            fi
            echo "Release ${TAG} reconciled to channel ${CHANNEL}."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --prerelease
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
