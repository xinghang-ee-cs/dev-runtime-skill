name: Release Runtime Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills-manifest.json'
      - 'distribution/**'
      - 'install.py'
      - 'INSTALL.md'
      - '.github/workflows/release-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-skills-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest
        run: python scripts/validate-skill-manifest.py
      - name: Test synchronization tool
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build installation and import packages
        run: python scripts/build-install-packages.py --output /tmp/runtime-packages
      - name: Resolve release tag
        id: release
        run: |
          version="$(python -c 'import json; print(json.load(open("skills-manifest.json", encoding="utf-8"))["release_version"])')"
          channel="$(python -c 'import json; print(json.load(open("skills-manifest.json", encoding="utf-8"))["repository"]["channel"])')"
          case "$channel" in
            stable) prerelease=false ;;
            prerelease) prerelease=true ;;
            *) echo "Unsupported release channel: $channel" >&2; exit 1 ;;
          esac
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - name: Create release tag when missing
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Existing tag points to different code; bump release_version." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists at this exact commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Runtime Skills ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --prerelease --latest=false
            else
              gh release edit "$TAG" --prerelease=false
            fi
            echo "Release ${TAG} reconciled to channel ${CHANNEL}."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --prerelease
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
      - name: Upload deterministic installation assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for asset in /tmp/runtime-packages/*; do
            name="$(basename "$asset")"
            if echo "$existing" | grep -Fxq "$name"; then
              mkdir -p /tmp/existing-assets
              gh release download "$TAG" --pattern "$name" --dir /tmp/existing-assets --clobber
              cmp "$asset" "/tmp/existing-assets/$name"
            else
              gh release upload "$TAG" "$asset"
            fi
          done
      - name: Archive superseded patch releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mapfile -t obsolete_tags < <(
            git tag --list |
              python scripts/select-obsolete-patch-tags.py --current-tag "$TAG"
          )
          for obsolete_tag in "${obsolete_tags[@]}"; do
            if gh release view "$obsolete_tag" >/dev/null 2>&1; then
              gh release edit "$obsolete_tag" --draft --latest=false
              echo "Archived superseded patch release ${obsolete_tag} as a draft."
            fi
            git push origin ":refs/tags/${obsolete_tag}"
            echo "Removed superseded public tag ${obsolete_tag}."
          done
