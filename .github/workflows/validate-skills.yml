name: Validate Runtime Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills-manifest.json'
      - 'distribution/**'
      - 'install.py'
      - 'INSTALL.md'
      - '.github/workflows/release-skills.yml'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - 'skills-manifest.json'
      - 'distribution/**'
      - 'install.py'
      - 'INSTALL.md'
      - '.github/workflows/release-skills.yml'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest and version bumps
        if: github.event_name == 'pull_request'
        run: python scripts/validate-skill-manifest.py --compare-ref "${{ github.event.pull_request.base.sha }}"
      - name: Validate manifest
        if: github.event_name != 'pull_request'
        run: python scripts/validate-skill-manifest.py
      - name: Test synchronization tool
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build installation and import packages
        run: python scripts/build-install-packages.py --output /tmp/runtime-packages
      - name: Preserve reviewable packages
        uses: actions/upload-artifact@v4
        with:
          name: runtime-skill-install-packages
          path: /tmp/runtime-packages/*
