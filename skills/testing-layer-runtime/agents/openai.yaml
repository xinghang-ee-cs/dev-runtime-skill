interface:
  display_name: "Testing Layer Runtime"
  short_description: "Close phase testing and post-release Bugfix verification."
  default_prompt: "Use $testing-layer-runtime only after Long's frozen readiness receipt verifies. Advance only through the coarse forward test stages without turning commands or manual actions into micro-stages; preserve the existing per-item progression gate while allowing a test runner's safe internal parallelism. Map every in-scope FLOW to durable local business/E2E evidence; when deployed, bind cloud evidence to the complete identity, reconcile each identity change, verify release dependencies with their own prerequisite results, and keep findings open through retest closure. For bugfix-case/v1, reuse Long evidence, test only the Bug, affected and adjacent paths, and keep the Issue open until production retest plus similar-defect verification complete."
