interface:
  display_name: "Testing Layer Runtime"
  short_description: "Manage test lifecycle after long handoff."
  default_prompt: "Use $testing-layer-runtime for phase testing, revision-aware long handoff reuse, test ordering, manual/device/server/external validation, final acceptance evidence, change triage, and release handoff. Bind all phase test state to the project-specific writeback target, reuse valid long automation, classify findings before routing them to Testing, Long, or Planning, and pass the durable writeback/progression gates for every test item."
