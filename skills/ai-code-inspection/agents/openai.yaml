interface:
  display_name: "AI Code Inspection"
  short_description: "路由代码检查、根因诊断与持久 Bugfix Case"
  default_prompt: "使用 $ai-code-inspection 根据当前工作阶段选择十种场景之一，按项目环境档案和技术栈 Profile 完成代码检查、诊断或受控修复；四 Skill 项目的已确认实现缺陷建立 bugfix-case/v1 并交给 Long，只有规范治理交互执行 Step 1–7。"

policy:
  allow_implicit_invocation: true
