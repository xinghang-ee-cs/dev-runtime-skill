interface:
  display_name: "规划层运行时"
  short_description: "业务化规划、开发前安全配置与端到端验收合同"
  default_prompt: "使用 $planning-layer-runtime 先核实项目证据与可查公开事实，逐轮保存需求发现并维护跨期需求池；第一阶段始终使用业务白话，不把访谈变成数据库、接口或架构配置问卷。第一阶段完成后一次性生成全部适用规划草案，再按队列依次确认并定向修正；第二阶段合并长期用户画像与本期交互决定术语解释深度，涉及数据库时直接展示并确认现有库复用或新建、数据库类型、环境拓扑、远程库、可提供资料、迁移回退与数据治理方案，不静默假设就绪状态。对 Long 开始前必须由用户或外部方准备的环境、账号、外部工具和数据依赖，提供安全配置步骤并只核对存在性与脱敏证据，不收集秘密值；把仅云端测试或发布前需要的项精确移交。测试设计以 FLOW 业务旅程为主，每个适用 P0/P1 FLOW 定义本地业务或端到端证明；本期包含云端部署时，为全部 P0 正向旅程以及部署敏感或受变更影响的 P1 FLOW 定义绑定部署版本的云端端到端复验。涉及前端时生成可复制 Prompt、页面实现合同、UX 状态迁移和版本化资产索引，最终形成可由 Long 和 Testing 精确消费的 Handoff。"
